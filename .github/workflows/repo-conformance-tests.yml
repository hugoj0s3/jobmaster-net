name: Repo Conformance Tests

# Manual-only for now -- running the whole IntegrationTests assembly unfiltered hits a cross-collection
# race between the RavenDb and SQL (Postgres/MySql/SqlServer) conformance collections (RavenDb's fixture
# tears its container down while a concurrently-running SQL fixture's StartJobMasterRuntimeAsync() call
# is still iterating JobMasterClusterConnectionConfig.GetAllConfigs() -- a process-wide static list, not
# scoped to the SQL ServiceProvider -- and tries to reach RavenDb's already-disposed container). See
# reminders.md for the real fix. Re-enable the push/pull_request triggers once that's fixed.
on:
  workflow_dispatch:

jobs:
  conformance-tests:
    name: Repo Conformance (Postgres + MySql + SqlServer)
    runs-on: ubuntu-latest
    # Each provider's fixture spins up its own Testcontainers database and runs the full
    # conformance suite against it (Jobs, RecurringSchedules, GenericRecords, DistributedLocker,
    # AgentMessages) -- no external DB or secrets needed, same self-contained approach as
    # schedule-scenario-tests.yml.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Tests/JobMaster.IntegrationTests/JobMaster.IntegrationTests.csproj

      - name: Build
        run: dotnet build Tests/JobMaster.IntegrationTests/JobMaster.IntegrationTests.csproj --no-restore --configuration Release

      - name: Run conformance tests
        run: dotnet test Tests/JobMaster.IntegrationTests/JobMaster.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
