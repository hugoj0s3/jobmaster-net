name: Scenario Tests

# The scenario flavor matrix (tests/JobMaster.ScenarioMatrixTests), one runner per unit, on the pushed commit.
# Manual only: the whole matrix is 82 units. Scripts and notes: misc/scenario-github-actions/.
# (File name kept from the old suite's workflow: a manual run needs the file on the default branch.)
on:
  workflow_dispatch:
    inputs:
      units:
        description: "Regex of units, <Scenario>.<Flavor>[.<StopType|Auth>], e.g. DrainModeTest or BasicExecution|ApiAuthTest. Empty runs all."
        required: false
        default: ""

jobs:
  list-units:
    name: List units
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      units: ${{ steps.list.outputs.units }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # SDK from global.json; the 8.0 SDK for the net8.0 test builds (with the ASP.NET Core 8.0 runtime).
          global-json-file: global.json
          dotnet-version: '8.0.x'

      - name: List units
        id: list
        env:
          UNIT_FILTER: ${{ inputs.units }}
        run: |
          units="$(bash misc/scenario-github-actions/list-units.sh "$UNIT_FILTER")"
          echo "$units"
          echo "units=$units" >> "$GITHUB_OUTPUT"

  unit:
    name: ${{ matrix.unit }}
    needs: list-units
    runs-on: ubuntu-latest
    # ScheduleTest takes ~65-75 min; the unit itself is cut at 150 min, the rest is setup, build and image builds.
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.list-units.outputs.units) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build tests/JobMaster.ScenarioMatrixTests -v q -nologo

      - name: Run ${{ matrix.unit }}
        env:
          UNIT: ${{ matrix.unit }}
        run: bash misc/scenario-github-actions/run-unit.sh "$UNIT" 150 "$RUNNER_TEMP/results"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.unit }}
          path: ${{ runner.temp }}/results/${{ matrix.unit }}
          retention-days: 14
          if-no-files-found: ignore

  all-passed:
    name: All Scenario Tests Passed
    # One check for branch protection instead of every unit: fails if listing or any unit failed or was cancelled.
    needs: [list-units, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: |
          if [ "${{ needs.list-units.result }}" != "success" ] || [ "${{ needs.unit.result }}" != "success" ]; then
            echo "One or more scenario units did not pass."
            exit 1
          fi
