<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#bg)"/>

  <!-- Subtle grid lines for "orchestration" feel -->
  <g stroke="url(#accent)" stroke-opacity="0.15" stroke-width="1.2" fill="none">
    <line x1="60" y1="30" x2="60" y2="170"/>
    <line x1="100" y1="30" x2="100" y2="170"/>
    <line x1="140" y1="30" x2="140" y2="170"/>
    <line x1="30" y1="60" x2="170" y2="60"/>
    <line x1="30" y1="100" x2="170" y2="100"/>
    <line x1="30" y1="140" x2="170" y2="140"/>
  </g>

  <!-- Small node dots at intersections -->
  <g fill="#c4b5fd" fill-opacity="0.3">
    <circle cx="60" cy="60" r="3"/>
    <circle cx="100" cy="60" r="3"/>
    <circle cx="140" cy="60" r="3"/>
    <circle cx="60" cy="100" r="3"/>
    <circle cx="140" cy="100" r="3"/>
    <circle cx="60" cy="140" r="3"/>
    <circle cx="100" cy="140" r="3"/>
    <circle cx="140" cy="140" r="3"/>
  </g>

  <!-- JM Letters -->
  <text x="100" y="118" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="-2">JM</text>
</svg>
