<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="950" height="380" viewBox="0 0 950 380">
<defs>
  <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#ef4444"/>
  </marker>
  <marker id="ab" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#3b82f6"/>
  </marker>
  <marker id="aa" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#f59e0b"/>
  </marker>
  <filter id="sh">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.45"/>
  </filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.7" fill="#ffffff0d"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="950" height="380" fill="#09111f"/>
<rect width="950" height="380" fill="url(#dots)"/>

<!-- Title -->
<text x="475" y="36" fill="#e2e8f0" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">JobMaster — Drain Mode</text>
<line x1="60" y1="50" x2="890" y2="50" stroke="#1e3a5f" stroke-width="1"/>

<!-- ═══════════════════ LEFT: CRASHED WORKER + LOST BUCKET ═══════════════════ -->
<rect x="20" y="66" width="255" height="266" rx="14" fill="#140606" stroke="#ef4444" stroke-width="1.5" filter="url(#sh)"/>
<rect x="20" y="66" width="255" height="6" rx="3" fill="#ef4444"/>
<text x="147" y="92" fill="#fca5a5" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Former Worker</text>
<text x="147" y="108" fill="#ef4444" font-family="Arial" font-size="10.5" font-weight="bold" text-anchor="middle">Heartbeat Lost / Crashed</text>

<!-- Lost Bucket panel -->
<rect x="36" y="118" width="223" height="196" rx="8" fill="#1a0707" stroke="#ef4444" stroke-width="1.5"/>
<text x="147" y="138" fill="#fca5a5" font-family="Arial" font-size="12" font-weight="700" text-anchor="middle">Bucket  ·  status → LOST</text>

<!-- Bucket trapezoid (red, dimmed) + handle (dashed — bucket is "dead") -->
<path d="M 57,155 L 237,155 L 224,238 L 70,238 Z" fill="#1a0505" stroke="#b91c1c" stroke-width="1.5"/>
<ellipse cx="147" cy="155" rx="90" ry="11" fill="#230808" stroke="#b91c1c" stroke-width="1.5"/>
<path d="M 82,152 Q 147,125 212,152" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,3"/>
<text x="147" y="198" dominant-baseline="central" fill="#fca5a5" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">trapped jobs</text>
<text x="147" y="218" dominant-baseline="central" fill="#ef4444" font-family="Arial" font-size="9.5" text-anchor="middle">Unfinished &amp; Unsaved</text>

<!-- ═══════════════════ ARROW: Lost Bucket → Drain Worker ═══════════════════ -->
<line x1="277" y1="196" x2="350" y2="196" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aa)"/>
<text x="313" y="183" fill="#fbbf24" font-family="Arial" font-size="10.5" font-weight="bold" text-anchor="middle">claim</text>

<!-- ═══════════════════ CENTER: DRAIN WORKER ═══════════════════ -->
<rect x="352" y="96" width="210" height="236" rx="12" fill="#120800" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
<text x="457" y="119" fill="#fbbf24" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Drain Worker</text>
<text x="457" y="135" fill="#92400e" font-family="Arial" font-size="10.5" text-anchor="middle">Drain Mode</text>

<!-- Funnel icon (symbolises draining / redirecting) -->
<ellipse cx="457" cy="168" rx="42" ry="8" fill="#1a0e00" stroke="#f59e0b" stroke-width="1.5"/>
<path d="M 415,168 L 499,168 L 474,222 L 440,222 Z" fill="#130900" stroke="#d97706" stroke-width="1.5"/>
<ellipse cx="457" cy="222" rx="17" ry="6" fill="#1a0e00" stroke="#f59e0b" stroke-width="1.5"/>
<!-- Flow arrow inside funnel -->
<line x1="457" y1="181" x2="457" y2="212" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#aa)"/>

<text x="457" y="254" fill="#fbbf24" font-family="Arial" font-size="10" text-anchor="middle">redirects all jobs</text>
<text x="457" y="270" fill="#92400e" font-family="Arial" font-size="9.5" text-anchor="middle">exits cleanly when done</text>

<!-- ═══════════════════ ARROW: Drain Worker → Master DB ═══════════════════ -->
<line x1="564" y1="196" x2="637" y2="196" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="600" y="183" fill="#60a5fa" font-family="Arial" font-size="10.5" font-weight="bold" text-anchor="middle">redirect jobs</text>

<!-- ═══════════════════ RIGHT: MASTER DB ═══════════════════ -->
<rect x="639" y="66" width="220" height="266" rx="14" fill="#0c1d38" stroke="#1e4080" stroke-width="1.5" filter="url(#sh)"/>
<text x="749" y="90" fill="#60a5fa" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Master DB</text>
<text x="749" y="106" fill="#3b82f6" font-family="Arial" font-size="11" text-anchor="middle">Orchestration Store</text>

<!-- DB cylinder icon — 3 tiers -->
<ellipse cx="749" cy="136" rx="52" ry="9" fill="#1e4585" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="697" y="136" width="104" height="20" fill="#16316b"/>
<line x1="697" y1="136" x2="697" y2="156" stroke="#3b82f6" stroke-width="1.5"/>
<line x1="801" y1="136" x2="801" y2="156" stroke="#3b82f6" stroke-width="1.5"/>
<ellipse cx="749" cy="156" rx="52" ry="9" fill="#1e4585" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="697" y="156" width="104" height="20" fill="#162d5a"/>
<line x1="697" y1="156" x2="697" y2="176" stroke="#3b82f6" stroke-width="1.5"/>
<line x1="801" y1="156" x2="801" y2="176" stroke="#3b82f6" stroke-width="1.5"/>
<ellipse cx="749" cy="176" rx="52" ry="9" fill="#1e4585" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="697" y="176" width="104" height="20" fill="#16316b"/>
<line x1="697" y1="176" x2="697" y2="196" stroke="#3b82f6" stroke-width="1.5"/>
<line x1="801" y1="176" x2="801" y2="196" stroke="#3b82f6" stroke-width="1.5"/>
<ellipse cx="749" cy="196" rx="52" ry="9" fill="#1e4585" stroke="#3b82f6" stroke-width="1.5"/>
<text x="749" y="169" dominant-baseline="central" fill="#dbeafe" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">jobs</text>

<text x="749" y="222" fill="#64748b" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">STATUS = HeldOnMaster</text>

<!-- Re-queued badge -->
<rect x="653" y="232" width="192" height="24" rx="5" fill="#0e2010" stroke="#166534" stroke-width="1"/>
<text x="749" y="248" fill="#4ade80" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Re-queued for re-assignment</text>

<!-- Footer note -->
<text x="475" y="358" fill="#475569" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle">Drain Worker exits cleanly once all jobs have been redirected to the Master DB</text>
</svg>
