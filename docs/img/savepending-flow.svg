<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="430" viewBox="0 0 1050 430">
<defs>
  <marker id="ao" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#f59e0b"/>
  </marker>
  <marker id="ag" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#22c55e"/>
  </marker>
  <marker id="ab" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#3b82f6"/>
  </marker>
  <filter id="sh">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.45"/>
  </filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.7" fill="#ffffff0d"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="1050" height="430" fill="#09111f"/>
<rect width="1050" height="430" fill="url(#dots)"/>

<!-- Title -->
<text x="525" y="36" fill="#e2e8f0" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">JobMaster — SavePending: Decoupled Buffer &amp; Execution Shortcut</text>
<line x1="60" y1="50" x2="990" y2="50" stroke="#1e3a5f" stroke-width="1"/>

<!-- ═══════════════════ LEFT SIDE: INTAKE COLUMN ═══════════════════ -->

<!-- API Capsule -->
<rect x="40" y="70" width="230" height="70" rx="8" fill="#0c1d38" stroke="#1e4080" stroke-width="1.5" filter="url(#sh)"/>
<text x="155" y="96" fill="#60a5fa" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">API Producer / Clients</text>
<text x="155" y="115" fill="#93c5fd" font-family="Arial" font-size="11" text-anchor="middle">Schedules jobs in bulk volumes</text>

<!-- Arrow: Intake → Buffer -->
<line x1="155" y1="140" x2="155" y2="182" stroke="#f59e0b" stroke-width="2" marker-end="url(#ao)"/>

<!-- Agent Ephemeral DB Cushion Capsule -->
<rect x="40" y="190" width="230" height="95" rx="8" fill="#120830" stroke="#5b21b6" stroke-width="1.5" filter="url(#sh)"/>
<text x="155" y="215" fill="#a78bfa" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Agent Ephemeral DB</text>
<text x="155" y="235" fill="#c4b5fd" font-family="Arial" font-size="11.5" font-weight="bold" text-anchor="middle">cushions Master writes</text>
<text x="155" y="254" fill="#a78bfa" font-family="Arial" font-size="10.5" text-anchor="middle">Job saved as "PendingSave"</text>
<text x="155" y="268" fill="#7c3aed" font-family="Arial" font-size="10" text-anchor="middle">prevents lock contention spikes</text>

<!-- Split Arrows & Decision Node: Agent Buffer → Outcomes -->
<!-- Decision Node (TransientThreshold check) -->
<rect x="276" y="206" width="98" height="54" rx="6" fill="#120824" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/>
<!-- Clock Icon -->
<circle cx="325" cy="220" r="7" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
<path d="M 325,216 L 325,220 L 328,222" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round" fill="none"/>
<text x="325" y="244" fill="#a78bfa" font-family="Arial" font-size="9.5" font-weight="bold" text-anchor="middle">TransientThreshold</text>

<!-- Green YES path (Top) -->
<path d="M 374,228 C 390,215 410,180 430,154" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="382" y="174" width="30" height="15" rx="3" fill="#042f1a" stroke="#22c55e" stroke-width="0.8"/>
<text x="397" y="185" fill="#4ade80" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">YES</text>

<!-- Blue NO path (Bottom) -->
<path d="M 374,248 C 390,260 410,295 430,320" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="382" y="278" width="30" height="15" rx="3" fill="#0c1d38" stroke="#3b82f6" stroke-width="0.8"/>
<text x="397" y="289" fill="#60a5fa" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">NO</text>


<!-- ═══════════════════ RIGHT SIDE: OUTCOMES ═══════════════════ -->

<!-- 1. UPPER RIGHT PANEL: Worker & Bucket Shortcut (Green) -->
<rect x="440" y="70" width="570" height="142" rx="8" fill="#071a07" stroke="#22c55e" stroke-width="1.5" filter="url(#sh)"/>
<rect x="440" y="70" width="570" height="6" rx="3" fill="#22c55e"/>

<!-- Worker & Bucket Graphic inside green panel (Reduced size) -->
<!-- Worker Box -->
<rect x="465" y="95" width="140" height="92" rx="6" fill="#0b240b" stroke="#15803d" stroke-width="1.2"/>
<rect x="473" y="103" width="14" height="11" rx="2" fill="#15803d"/>
<circle cx="478" cy="108" r="2" fill="#bbf7d0"/>
<text x="494" y="112" fill="#86efac" font-family="Arial" font-size="10" font-weight="bold">Worker A</text>

<!-- Bucket inside Worker -->
<rect x="473" y="122" width="124" height="34" rx="4" fill="#051405" stroke="#22c55e" stroke-width="1"/>
<text x="535" y="133" fill="#bbf7d0" font-family="Arial" font-size="8.5" font-weight="bold" text-anchor="middle">Bucket-A1</text>
<rect x="479" y="139" width="52" height="12" rx="3" fill="#22c55e"/>
<text x="505" y="149" fill="white" font-family="Arial" font-size="8.5" font-weight="bold" text-anchor="middle">Job #1</text>
<rect x="537" y="139" width="52" height="12" rx="3" fill="#082008"/>
<text x="563" y="148" fill="#14532d" font-family="Arial" font-size="8" text-anchor="middle">empty</text>

<!-- Queue label -->
<text x="535" y="174" fill="#86efac" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">status → InBucket</text>

<!-- Explanation Text inside green panel -->
<text x="625" y="108" fill="#86efac" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="700">Immediate Bucket Shortcut</text>
<text x="625" y="128" fill="#a7f3d0" font-family="Arial" font-size="11" font-weight="bold">Assigns to bucket directly for fast execution</text>
<text x="625" y="146" fill="#e6fcf5" font-family="Arial" font-size="11">Stores job status on Master, but stays in bucket</text>
<text x="625" y="162" fill="#e6fcf5" font-family="Arial" font-size="11">Bypasses normal scanner database lookup routes</text>
<text x="625" y="178" fill="#34d399" font-family="Arial" font-size="11" font-weight="bold">Executes instantly on the local worker</text>


<!-- 2. LOWER RIGHT PANEL: Master DB Async Sync-Back (Blue) -->
<rect x="440" y="240" width="570" height="142" rx="8" fill="#091830" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
<rect x="440" y="240" width="570" height="6" rx="3" fill="#3b82f6"/>

<!-- Master DB Graphic inside blue panel -->
<ellipse cx="535" cy="272" rx="32" ry="7" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.2"/>
<rect x="503" y="272" width="64" height="20" fill="#172554"/>
<line x1="503" y1="272" x2="503" y2="292" stroke="#3b82f6" stroke-width="1.2"/>
<line x1="567" y1="272" x2="567" y2="292" stroke="#3b82f6" stroke-width="1.2"/>
<ellipse cx="535" cy="292" rx="32" ry="7" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.2"/>
<rect x="503" y="292" width="64" height="20" fill="#1e1b4b"/>
<line x1="503" y1="292" x2="503" y2="312" stroke="#3b82f6" stroke-width="1.2"/>
<line x1="567" y1="292" x2="567" y2="312" stroke="#3b82f6" stroke-width="1.2"/>
<ellipse cx="535" cy="312" rx="32" ry="7" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.2"/>
<rect x="503" y="312" width="64" height="20" fill="#172554"/>
<line x1="503" y1="312" x2="503" y2="332" stroke="#3b82f6" stroke-width="1.2"/>
<line x1="567" y1="312" x2="567" y2="332" stroke="#3b82f6" stroke-width="1.2"/>
<ellipse cx="535" cy="332" rx="32" ry="7" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.2"/>
<!-- "Master DB" label -->
<text x="535" y="356" fill="#60a5fa" font-family="Arial" font-size="9.5" font-weight="bold" text-anchor="middle">Master DB</text>

<!-- Explanation Text inside blue panel -->
<text x="625" y="278" fill="#93c5fd" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="700">Asynchronous Master Sync-Back</text>
<text x="625" y="298" fill="#bfdbfe" font-family="Arial" font-size="11" font-weight="bold">Saves job to Master DB</text>
<text x="625" y="316" fill="#eff6ff" font-family="Arial" font-size="11">Stays in Master DB until transient time is reached</text>
<text x="625" y="334" fill="#eff6ff" font-family="Arial" font-size="11">Pulls asynchronously in non-blocking batches</text>
<text x="625" y="352" fill="#60a5fa" font-family="Arial" font-size="11" font-weight="bold">according to TransferBatchSize (default=1000)</text>

</svg>
