<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="950" height="360" viewBox="0 0 950 360">
<defs>
  <marker id="ao" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#f59e0b"/>
  </marker>
  <filter id="sh">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.45"/>
  </filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.7" fill="#ffffff0d"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="950" height="360" fill="#09111f"/>
<rect width="950" height="360" fill="url(#dots)"/>

<!-- Title -->
<text x="475" y="36" fill="#e2e8f0" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">JobMaster — Coordinator Mode</text>
<line x1="60" y1="50" x2="890" y2="50" stroke="#1e3a5f" stroke-width="1"/>

<!-- ═══════════════════ MASTER DB (left) ═══════════════════ -->
<rect x="30" y="66" width="210" height="250" rx="14" fill="#0c1d38" stroke="#1e4080" stroke-width="1.5" filter="url(#sh)"/>
<text x="135" y="90" fill="#60a5fa" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Master DB</text>
<text x="135" y="105" fill="#3b82f6" font-family="Arial" font-size="11" text-anchor="middle">Source of Truth</text>

<!-- DB cylinder icon — 3 tiers -->
<ellipse cx="135" cy="135" rx="48" ry="9" fill="#1e4585" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="87" y="135" width="96" height="20" fill="#16316b"/>
<line x1="87" y1="135" x2="87" y2="155" stroke="#3b82f6" stroke-width="1.5"/>
<line x1="183" y1="135" x2="183" y2="155" stroke="#3b82f6" stroke-width="1.5"/>
<ellipse cx="135" cy="155" rx="48" ry="9" fill="#1e4585" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="87" y="155" width="96" height="20" fill="#162d5a"/>
<line x1="87" y1="155" x2="87" y2="175" stroke="#3b82f6" stroke-width="1.5"/>
<line x1="183" y1="155" x2="183" y2="175" stroke="#3b82f6" stroke-width="1.5"/>
<ellipse cx="135" cy="175" rx="48" ry="9" fill="#1e4585" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="87" y="175" width="96" height="20" fill="#16316b"/>
<line x1="87" y1="175" x2="87" y2="195" stroke="#3b82f6" stroke-width="1.5"/>
<line x1="183" y1="175" x2="183" y2="195" stroke="#3b82f6" stroke-width="1.5"/>
<ellipse cx="135" cy="195" rx="48" ry="9" fill="#1e4585" stroke="#3b82f6" stroke-width="1.5"/>
<text x="135" y="168" dominant-baseline="central" fill="#dbeafe" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">jobs</text>

<text x="135" y="222" fill="#64748b" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">STATUS = HeldOnMaster</text>
<rect x="44" y="233" width="182" height="24" rx="5" fill="#0e2010" stroke="#166534" stroke-width="1"/>
<text x="135" y="249" fill="#4ade80" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">within TransientThreshold</text>

<!-- ═══════════════════ ARROW: DB → Coordinator ═══════════════════ -->
<line x1="243" y1="188" x2="345" y2="188" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#ao)"/>
<text x="294" y="175" fill="#fbbf24" font-family="Arial" font-size="10.5" font-weight="bold" text-anchor="middle">scan &amp; acquire</text>

<!-- ═══════════════════ COORDINATOR (center) ═══════════════════ -->
<rect x="347" y="105" width="180" height="190" rx="12" fill="#120830" stroke="#5b21b6" stroke-width="1.5" filter="url(#sh)"/>
<text x="437" y="128" fill="#a78bfa" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Coordinator</text>

<!-- Gear icon (cx=437, cy=195, r=28) -->
<circle cx="437" cy="195" r="28" fill="#1a0f3e" stroke="#5b21b6" stroke-width="2"/>
<circle cx="437" cy="195" r="16" fill="#2d1b69" stroke="#7c3aed" stroke-width="1.5"/>
<circle cx="437" cy="195" r="6" fill="#1a0f3e"/>
<!-- Straight teeth -->
<line x1="437" y1="157" x2="437" y2="165" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
<line x1="437" y1="225" x2="437" y2="233" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
<line x1="399" y1="195" x2="407" y2="195" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
<line x1="467" y1="195" x2="475" y2="195" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
<!-- Diagonal teeth -->
<line x1="409" y1="167" x2="416" y2="174" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
<line x1="458" y1="216" x2="465" y2="223" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
<line x1="409" y1="223" x2="416" y2="216" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
<line x1="458" y1="174" x2="465" y2="167" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>

<text x="437" y="255" fill="#c4b5fd" font-family="Arial" font-size="10" text-anchor="middle">Priority + WorkerLane</text>
<text x="437" y="270" fill="#7c3aed" font-family="Arial" font-size="9.5" text-anchor="middle">match &amp; assign</text>

<!-- ═══════════════════ ARROW: Coordinator → Buckets ═══════════════════ -->
<line x1="529" y1="188" x2="625" y2="188" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="577" y="175" fill="#fbbf24" font-family="Arial" font-size="10.5" font-weight="bold" text-anchor="middle">distribute</text>

<!-- ═══════════════════ BUCKETS (right) ═══════════════════ -->
<rect x="628" y="66" width="290" height="250" rx="14" fill="#061a1a" stroke="#0e7490" stroke-width="1.5" filter="url(#sh)"/>
<text x="773" y="90" fill="#67e8f9" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Buckets</text>
<text x="773" y="105" fill="#0891b2" font-family="Arial" font-size="11" text-anchor="middle">Ephemeral Transport</text>

<!-- Bucket A — trapezoid body + ellipse top + handle -->
<path d="M 645,128 L 745,128 L 736,210 L 654,210 Z" fill="#072020" stroke="#06b6d4" stroke-width="1.5"/>
<ellipse cx="695" cy="128" rx="50" ry="9" fill="#0a2e2e" stroke="#06b6d4" stroke-width="1.5"/>
<path d="M 663,126 Q 695,104 727,126" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
<text x="695" y="174" dominant-baseline="central" fill="#67e8f9" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Bucket A</text>

<!-- Bucket B — trapezoid body + ellipse top + handle -->
<path d="M 764,128 L 864,128 L 855,210 L 773,210 Z" fill="#190e00" stroke="#f59e0b" stroke-width="1.5"/>
<ellipse cx="814" cy="128" rx="50" ry="9" fill="#2a1800" stroke="#f59e0b" stroke-width="1.5"/>
<path d="M 782,126 Q 814,104 846,126" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
<text x="814" y="174" dominant-baseline="central" fill="#fbbf24" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Bucket B</text>

<text x="773" y="238" fill="#64748b" font-family="Arial" font-size="10.5" font-weight="bold" text-anchor="middle">STATUS = InBucket</text>
</svg>
